name: Self-Hosted Valhalla Release

# Manual only, deliberately — this branch changes far less often than main
# (a personal config override, not day-to-day feature work), so there's no
# push trigger here the way main's daily-release.yml has. Trigger with:
# gh workflow run personal-release.yml --ref personal/self-hosted-valhalla
# (the --ref matters — workflow_dispatch defaults to the repo's default
# branch otherwise, which would build main's config instead of this one).
on:
  workflow_dispatch:

jobs:
  create-self-hosted-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Actions to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Tag Name
        id: tag
        run: |
          # "self-hosted-" prefix keeps this entirely separate from main's
          # plain "vYYYY-MM-DD" tags — no collision risk even on the same
          # day, and immediately identifiable in the tag list.
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8.x requires >=22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into the Android shell
        run: npm run cap:sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # @capacitor/android 8.x's own build.gradle requires Java 21 source/target compatibility

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same repo-level secrets daily-release.yml uses on main — secrets
      # aren't branch-scoped by default, so nothing extra to configure here.
      - name: Decode the release keystore
        id: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          ASSETS=()
          if [ -f "$APK_SRC" ]; then
            # Distinct filename from main's osm-navigator.apk — the two
            # releases can never collide even if someone downloads both
            # into the same folder.
            cp "$APK_SRC" osm-navigator-self-hosted.apk
            ASSETS+=(osm-navigator-self-hosted.apk)
          else
            echo "::warning::No signed APK produced (ANDROID_KEYSTORE_BASE64 secret not set, or the build failed) — this release will be source-only."
          fi

          TAG="self-hosted-v${{ steps.tag.outputs.date }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running this manually more than once on the same day would
            # otherwise collide on the date-based tag.
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            fi
          else
            # --latest=false is the whole point: main's daily release must
            # stay what /releases/latest/download/osm-navigator.apk
            # resolves to, regardless of how recently this ran. This still
            # shows as a normal (non-prerelease) release on the releases
            # page — just never the one GitHub calls "Latest".
            gh release create "$TAG" \
              --title "Self-Hosted Valhalla Release ${{ steps.tag.outputs.date }}" \
              --generate-notes \
              --latest=false \
              "${ASSETS[@]}"
          fi
