name: Daily Release

on:
  schedule:
    # GitHub Actions uses UTC.
    # If you want 5:00 PM IST: '30 11 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  create-daily-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Actions to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch git history so we can check past commits

      - name: Check for commits in the last 24 hours
        id: check_commits
        run: |
          # Look for commits in the last 24 hours
          COMMITS=$(git log --since="24 hours ago" --oneline)

          if [ -z "$COMMITS" ]; then
            echo "No new commits in the last 24 hours. Skipping release."
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found new commits:"
            echo "$COMMITS"
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Tag Name
        if: steps.check_commits.outputs.has_commits == 'true'
        id: tag
        run: |
          # Creates a tag like "v2023-10-25"
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.check_commits.outputs.has_commits == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8.x requires >=22

      - name: Install npm dependencies
        if: steps.check_commits.outputs.has_commits == 'true'
        run: npm ci

      - name: Sync web assets into the Android shell
        if: steps.check_commits.outputs.has_commits == 'true'
        run: npm run cap:sync

      - name: Set up JDK 21
        if: steps.check_commits.outputs.has_commits == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # @capacitor/android 8.x's own build.gradle requires Java 21 source/target compatibility

      - name: Set up Android SDK
        if: steps.check_commits.outputs.has_commits == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.check_commits.outputs.has_commits == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Only present on this repo (not on a fork) — see the "Building a
      # signed APK in CI" section of the README for how to add these.
      # Everything below is a no-op without them: the release still gets
      # created, just without an APK attached.
      - name: Decode the release keystore
        id: keystore
        if: steps.check_commits.outputs.has_commits == 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Create GitHub Release
        if: steps.check_commits.outputs.has_commits == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          ASSETS=()
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" osm-navigator.apk
            ASSETS+=(osm-navigator.apk)
          else
            echo "::warning::No signed APK produced (ANDROID_KEYSTORE_BASE64 secret not set, or the build failed) — this release will be source-only."
          fi

          gh release create "v${{ steps.tag.outputs.date }}" \
            --title "Daily Release ${{ steps.tag.outputs.date }}" \
            --generate-notes \
            "${ASSETS[@]}"
