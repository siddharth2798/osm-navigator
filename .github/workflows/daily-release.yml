name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Actions to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required so gh release's --generate-notes can diff against the previous tag

      - name: Generate Tag Name
        id: tag
        run: |
          # Creates a tag like "v2023-10-25" — same-day pushes land on the
          # same tag/release (see the "Create GitHub Release" step below,
          # which uploads onto the existing release instead of failing).
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8.x requires >=22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into the Android shell
        run: npm run cap:sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # @capacitor/android 8.x's own build.gradle requires Java 21 source/target compatibility

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only present on this repo (not on a fork) — see the "Building a
      # signed APK in CI" section of the README for how to add these.
      # Everything below is a no-op without them: the release still gets
      # created, just without an APK attached.
      - name: Decode the release keystore
        id: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          ASSETS=()
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" osm-navigator.apk
            ASSETS+=(osm-navigator.apk)
          else
            echo "::warning::No signed APK produced (ANDROID_KEYSTORE_BASE64 secret not set, or the build failed) — this release will be source-only."
          fi

          TAG="v${{ steps.tag.outputs.date }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A day with more than one push (or a manual workflow_dispatch
            # re-run) would otherwise collide on the date-based tag —
            # update the existing release's asset instead of failing.
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            fi
          else
            gh release create "$TAG" \
              --title "Release ${{ steps.tag.outputs.date }}" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
