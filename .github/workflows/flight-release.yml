name: AeroNav Release

# Auto-builds on every push to personal/flight-tracking, same shape as
# daily-release.yml on main — a push-triggered workflow is evaluated
# against the copy of THIS FILE on the branch that was pushed to, not
# main's copy, so the `branches: [personal/flight-tracking]` filter below
# has to actually live in that branch's own .github/workflows/flight-release.yml
# for the push trigger to fire there at all. It's mirrored onto main's copy
# too purely so the file (and workflow_dispatch below) stays discoverable
# from the default branch — see the next paragraph — but a push to main
# itself never matches this branch filter, so it can't double-build main.
#
# workflow_dispatch stays as a manual fallback (e.g. re-running today's
# build without a new commit): gh workflow run flight-release.yml --ref
# personal/flight-tracking (the --ref matters — workflow_dispatch defaults
# to the repo's default branch otherwise, which would build main's app
# instead of this one).
#
# This file has to exist on main too, even though it only ever builds
# personal/flight-tracking's code — gh workflow run --ref <branch> can
# only dispatch a workflow whose *file* is discoverable from the
# repository's default branch. Same reason personal-release.yml lives on
# main despite only ever building the self-hosted-Valhalla branch.
on:
  push:
    branches: [personal/flight-tracking]
  workflow_dispatch:

jobs:
  create-aeronav-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Actions to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Tag Name
        id: tag
        run: |
          # "aeronav-" prefix keeps this entirely separate from main's
          # plain "vYYYY-MM-DD" tags and the self-hosted branch's
          # "self-hosted-vYYYY-MM-DD" tags — no collision risk ever.
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8.x requires >=22

      - name: Install npm dependencies
        run: npm ci

      - name: Sync web assets into the Android shell
        run: npm run cap:sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # @capacitor/android 8.x's own build.gradle requires Java 21 source/target compatibility

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same repo-level secrets daily-release.yml uses on main — secrets
      # aren't branch-scoped by default, so nothing extra to configure here.
      - name: Decode the release keystore
        id: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          ASSETS=()
          if [ -f "$APK_SRC" ]; then
            # Distinct filename and applicationId (com.aeronav.app) from
            # main's osm-navigator.apk — installs as its own separate app,
            # not an upgrade of the regular Navigator install.
            cp "$APK_SRC" aeronav.apk
            ASSETS+=(aeronav.apk)
          else
            echo "::warning::No signed APK produced (ANDROID_KEYSTORE_BASE64 secret not set, or the build failed) — this release will be source-only."
          fi

          TAG="aeronav-v${{ steps.tag.outputs.date }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running this manually more than once on the same day would
            # otherwise collide on the date-based tag.
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            fi
          else
            # --latest=false is the whole point: main's daily release must
            # stay what /releases/latest/download/osm-navigator.apk
            # resolves to, regardless of how recently this ran. This still
            # shows as a normal (non-prerelease) release on the releases
            # page — just never the one GitHub calls "Latest".
            gh release create "$TAG" \
              --title "AeroNav Release ${{ steps.tag.outputs.date }}" \
              --generate-notes \
              --latest=false \
              "${ASSETS[@]}"
          fi
