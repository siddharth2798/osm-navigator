ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // Same version @capacitor-community/background-geolocation's own
    // build.gradle already pulls in as an `implementation` dependency (not
    // `api`) — that scope means it's NOT exposed transitively to :app's own
    // classpath (confirmed live: MainActivity failed to compile against
    // com.google.android.gms.location.* without this), so :app declares it
    // explicitly too, sharing this one version number rather than a second
    // hardcoded copy — see that plugin's build.gradle, which checks
    // rootProject.ext.playServicesLocationVersion before its own '21.0.1'
    // fallback.
    playServicesLocationVersion = '21.0.1'
}