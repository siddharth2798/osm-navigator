<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect x="56" y="56" width="912" height="912" rx="170" fill="#242424"/>

  <!-- winding route -->
  <path d="M 250,830 C 250,750 380,750 380,680 C 380,610 250,610 250,540 C 250,460 470,470 560,410"
        fill="none" stroke="#f2f2f2" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- destination pin -->
  <path d="M 660,196 C 597,196 546,247 546,310 C 546,392 660,472 660,472 C 660,472 774,392 774,310 C 774,247 723,196 660,196 Z"
        fill="#f2f2f2"/>
  <circle cx="660" cy="308" r="42" fill="#242424"/>

  <!-- small aircraft in the sky, upper-left, with a short motion trail — the
       one visual difference from the regular Navigator app's icon, marking
       this as AeroNav (personal flight-tracking branch). -->
  <g transform="translate(188,196) rotate(-18) scale(5.9)">
    <path d="M21 3 L4 10 L11 13 L14 21 Z" fill="#f2f2f2"/>
    <path d="M21 3 L11 13" stroke="#f2f2f2" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <g stroke="#f2f2f2" stroke-width="9" stroke-linecap="round" opacity="0.55">
    <line x1="168" y1="352" x2="222" y2="328"/>
    <line x1="196" y1="388" x2="242" y2="368"/>
  </g>
</svg>
